apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  # Qué se escala
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 5
  # Con qué criterio
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50     # Escala si el uso medio supera el 50% del "request" (50m)
  # - type: Resource                # Ejemplo opcional: también por memoria
  #   resource:
  #     name: memory
  #     target:
  #       type: Utilization
  #       averageUtilization: 80
  # Qué tan rápido sube y baja (valores ajustados para ver el efecto en una demo)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2                   # Máximo 2 Pods nuevos...
        periodSeconds: 15          # ...cada 15 segundos
    scaleDown:
      stabilizationWindowSeconds: 60   # Espera 60 s de calma antes de reducir (por defecto: 300 s)
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
