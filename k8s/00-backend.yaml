apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # IMPORTANTE: no se define "replicas". Si lo hiciéramos, cada
  # "kubectl apply" reiniciaría el número de réplicas que decidió el HPA.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hpa-backend:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        # OBLIGATORIO para el HPA: el porcentaje de CPU se calcula respecto a "requests".
        # Sin requests, el HPA muestra <unknown> y no escala.
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
