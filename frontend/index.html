<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo HPA - Kubernetes</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex;
           justify-content: center; padding: 40px 15px; }
    .card { background: #fff; padding: 25px 35px; border-radius: 10px; width: 100%;
            max-width: 560px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { color: #326ce5; margin-top: 0; }
    button { padding: 8px 14px; border: 0; border-radius: 5px; background: #326ce5;
             color: #fff; cursor: pointer; margin-right: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
    #estado { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Demo de HPA</h1>
    <p>Cada segundo se llama al backend. Al escalar, verás nuevos Pods en la tabla.</p>
    <button id="toggle">Pausar</button>
    <button id="reset">Reiniciar contadores</button>
    <p id="estado"></p>
    <table>
      <thead><tr><th>Pod del backend</th><th>Respuestas</th></tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>

  <script>
    let conteo = {};
    let activo = true;
    const tabla = document.getElementById('tabla');
    const estado = document.getElementById('estado');

    function pintar() {
      tabla.innerHTML = '';
      Object.entries(conteo).sort().forEach(([pod, n]) => {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td'); td1.textContent = pod;
        const td2 = document.createElement('td'); td2.textContent = n;
        tr.append(td1, td2);
        tabla.appendChild(tr);
      });
    }

    async function consultar() {
      if (!activo) return;
      try {
        const r = await fetch('/api/info');
        const d = await r.json();
        conteo[d.pod] = (conteo[d.pod] || 0) + 1;
        estado.textContent = 'Pods distintos vistos: ' + Object.keys(conteo).length;
        pintar();
      } catch (e) {
        estado.textContent = 'Error al contactar el backend';
      }
    }

    document.getElementById('toggle').onclick = (ev) => {
      activo = !activo;
      ev.target.textContent = activo ? 'Pausar' : 'Reanudar';
    };
    document.getElementById('reset').onclick = () => { conteo = {}; pintar(); };

    setInterval(consultar, 1000);
    consultar();
  </script>
</body>
</html>
