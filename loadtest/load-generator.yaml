# Genera carga contra el backend. NO está en k8s/ a propósito:
# solo se aplica cuando quieres provocar el escalado (scripts/load-test.sh start).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - "while true; do wget -q -O- 'http://backend:5000/api/cpu?ms=100' > /dev/null; done"
        resources:
          requests:
            cpu: "20m"
            memory: "8Mi"
          limits:
            cpu: "100m"
            memory: "16Mi"
